name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production (otherwise a preview deployment is created)
        type: boolean
        default: false

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - uses: mymindstorm/setup-emsdk@v14

      - name: Build the WebAssembly module
        run: bash scripts/build-wasm.sh

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix demo

      - name: Test
        run: npm test

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the Vercel project settings
        run: vercel pull --yes --environment=${{ inputs.production && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ inputs.production && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt ${{ inputs.production && '--prod' || '' }} --token="$VERCEL_TOKEN"
